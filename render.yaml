services:
  - type: web
    name: gaya-splatoon-server
    runtime: node
    plan: free
    buildCommand: npm ci --onnxruntime-node-install-cuda=skip && npm run build -w @gaya/shared && npm run build -w @gaya/server
    startCommand: npm run start -w @gaya/server
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24

  - type: web
    name: gaya-splatoon-web
    runtime: static
    buildCommand: npm ci --onnxruntime-node-install-cuda=skip && npm run build -w @gaya/shared && npm run build -w @gaya/web
    staticPublishPath: apps/web/dist
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: VITE_SERVER_HOST
        fromService:
          name: gaya-splatoon-server
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
